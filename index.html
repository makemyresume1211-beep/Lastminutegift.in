<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>We'll Be Back Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0b0b0f;
      --text: #e8e8f0;
      --muted: #9aa0a6;
      --accent: #ff3b3b; /* Clipper red vibe */
      --card: #15151a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1a1a24, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .container {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.1;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    p.lead {
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto 2rem;
    }

    .hero {
      position: relative;
      margin: 2.5rem auto 1.5rem;
      width: min(360px, 90vw);
      aspect-ratio: 3 / 4;
      display: grid;
      place-items: center;
    }

    /* Stylized Clipper-style lighter */
    .lighter {
      position: relative;
      width: 160px;
      height: 260px;
      border-radius: 24px;
      background: linear-gradient(180deg, #ff5252, #c62828);
      box-shadow:
        0 20px 40px rgba(0,0,0,0.6),
        inset 0 2px 0 rgba(255,255,255,0.15),
        inset 0 -2px 0 rgba(0,0,0,0.25);
      transform: rotate(-6deg);
    }

    /* Top cap */
    .lighter::before {
      content: "";
      position: absolute;
      top: -18px;
      left: 10px;
      right: 10px;
      height: 22px;
      background: linear-gradient(180deg, #d0d0d8, #9aa0a6);
      border-radius: 10px 10px 4px 4px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.6),
        0 2px 6px rgba(0,0,0,0.4);
    }

    /* Flame */
    .flame {
      position: absolute;
      top: -54px;
      left: 50%;
      width: 36px;
      height: 54px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at 50% 70%, #fff740 0%, #ff9800 45%, #ff3b3b 80%, transparent 85%);
      filter: blur(1px);
      animation: flicker 1.6s infinite ease-in-out;
      opacity: 0.9;
    }

    @keyframes flicker {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.06, 0.96); }
    }

    /* Brand strip */
    .brand {
      position: absolute;
      bottom: 40px;
      left: 16px;
      right: 16px;
      height: 28px;
      background: rgba(0,0,0,0.35);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .cta {
      margin-top: 2rem;
      display: inline-flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      appearance: none;
      border: 0;
      padding: 0.8rem 1.2rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 20px rgba(255, 59, 59, 0.35);
    }

    .btn.secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Subtle glow behind lighter */
    .glow {
      position: absolute;
      inset: -40px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, rgba(255, 59, 59, 0.35), transparent 60%);
      filter: blur(24px);
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>We’re lighting something new.</h1>
    <p class="lead">
      Our site is getting a fresh spark. We’ll be back soon with a new experience.
    </p>

    <div class="hero">
      <div class="glow"></div>
      <div class="flame"></div>
      <div class="lighter">
        <div class="brand">Clipper</div>
      </div>
    </div>

    <div class="cta">
      <a class="btn primary" href="mailto:you@example.com">Get in touch</a>
      <a class="btn secondary" href="https://github.com/yourusername" target="_blank" rel="noopener">Follow on GitHub</a>
    </div>

    <footer>
      Thanks for your patience. Something cool is in the works.
    </footer>
  </div>
</body>
</html>
